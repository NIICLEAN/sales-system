    <path d="M132 22 C105 72 75 108 75 156 C75 201 100 232 132 232 C164 232 189 202 189 156 C189 109 160 73 132 22Z" fill="url(#dropMain)"/>
    <path d="M132 22 C146 79 183 110 183 161 C183 194 166 220 146 232 C181 228 212 194 212 151 C212 105 182 69 132 22Z" fill="url(#dropAccent)"/>

    <polygon points="132,102 137,116 152,116 140,125 145,140 132,131 119,140 124,125 112,116 127,116" fill="#FFFFFF"/>
  </g>

  <text x="320" y="192" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="128" fill="#2A56DE">NII Clean</text>
</svg>
