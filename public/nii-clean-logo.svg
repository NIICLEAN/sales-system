<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NII Clean Logo</title>
  <desc id="desc">Blue and cyan drop mark with NII Clean wordmark</desc>
  <defs>
    <linearGradient id="outerRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F66F5" />
      <stop offset="100%" stop-color="#2841D6" />
    </linearGradient>
    <linearGradient id="dropMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D61E8" />
      <stop offset="100%" stop-color="#2345CB" />
    </linearGradient>
    <linearGradient id="dropAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65C6F2" />
      <stop offset="100%" stop-color="#49A8DD" />
